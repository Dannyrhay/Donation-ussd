services:
  - type: web
    name: jesus-mission-fund-ussd
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HUBTEL_API_KEY
        sync: false
      - key: HUBTEL_API_SECRET
        sync: false
      - key: HUBTEL_MERCHANT_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ORG_NAME
        value: Jesus Mission Fund
