# CI — runs tests and a dependency audit on every push and pull request.
#
# Deployment is NOT done here: Railway auto-deploys from GitHub on push to main.
# To stop broken code from going live, enable "Wait for CI" in the Railway
# service settings so it only deploys commits whose checks pass.
#
# No secrets needed — the test suite mocks MongoDB and Hubtel.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test -- --ci
        env:
          NODE_ENV: test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
